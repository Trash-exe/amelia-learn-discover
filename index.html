:root{--p:#7c3aed;--p2:#a78bfa;--t:#0d9488;--c:#f43f5e;--g:#f59e0b;--bg:#faf5ff;--ink:#2e1065;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#f5f3ff,#fdf2f8 55%,#ecfeff);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:linear-gradient(90deg,#6d28d9,#9333ea 60%,#db2777);color:#fff;box-shadow:0 4px 18px #6d28d933}
header img{width:46px;height:46px;border-radius:12px}
header h1{font-size:22px;margin:0;flex:1}header h1 small{display:block;font-size:13px;font-weight:500;opacity:.85}
.pill{background:#ffffff26;border-radius:99px;padding:7px 13px;font-weight:700;font-size:15px}
.hbtn{background:#ffffff26;color:#fff;border-radius:12px;padding:8px 12px;font-size:20px}
main{max-width:1100px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:#fff;color:var(--p);padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:0 2px 8px #7c3aed1a}
.tab.on{background:var(--p);color:#fff}
.today{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 18px;margin-bottom:16px;box-shadow:0 3px 14px #7c3aed14}
.stars3 span{font-size:28px;filter:grayscale(1);opacity:.35}.stars3 span.on{filter:none;opacity:1}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.lvl{background:#fff;border-radius:18px;padding:14px;text-align:left;box-shadow:0 3px 12px #7c3aed14;position:relative;min-height:128px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.lvl .n{font-size:12px;font-weight:800;color:var(--p2);letter-spacing:.06em}.lvl .e{font-size:30px}.lvl b{font-size:15px}
.lvl.locked{opacity:.45}.lvl.done{background:linear-gradient(150deg,#ecfdf5,#fff)}.lvl.cur{outline:3px solid var(--g);animation:pulse 2s infinite}
.lvl .st{position:absolute;top:10px;right:12px;font-size:14px}
@keyframes pulse{50%{box-shadow:0 0 0 8px #f59e0b33}}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cat{background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;color:var(--ink)}.cat.on{background:var(--t);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vid{background:#fff;border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 3px 12px #7c3aed14;padding:0;color:var(--ink)}
.vid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.vid div{padding:9px 11px;font-size:14px;font-weight:600;line-height:1.25}
.vid small{display:block;color:#7c6aa8;font-weight:500;margin-top:4px}
.ov{position:fixed;inset:0;background:#1e1036e6;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.box{background:#fff;border-radius:24px;padding:24px;max-width:720px;width:100%;max-height:94vh;overflow:auto;position:relative}
.big{font-size:22px;line-height:1.4}
.btn{background:var(--p);color:#fff;padding:13px 22px;border-radius:14px;font-weight:800;font-size:17px}
.btn.alt{background:#ede9fe;color:var(--p)}.btn.t{background:var(--t)}.btn.c{background:var(--c)}
.pw{position:relative;width:min(1000px,96vw);aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.pw iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.blk{position:absolute;z-index:3;background:transparent}
.blk.top{top:0;left:0;right:0;height:22%}.blk.br{right:0;bottom:0;width:22%;height:16%}.blk.bl{left:0;bottom:0;width:18%;height:16%}
.endc{position:absolute;inset:0;z-index:5;background:linear-gradient(150deg,#6d28d9,#db2777);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:26px;font-weight:800;text-align:center}
.pctl{display:flex;gap:10px;justify-content:center;margin-top:12px}
.qprog{height:10px;background:#ede9fe;border-radius:9px;overflow:hidden;margin:6px 0 14px}.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--p))}
.qpic{font-size:44px;text-align:center;margin:6px 0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ans button{background:#f5f3ff;border:2px solid #ddd6fe;border-radius:14px;padding:14px;font-size:19px;font-weight:700;color:var(--ink);min-height:62px}
.ans button.ok{background:#d1fae5;border-color:#10b981}.ans button.no{background:#ffe4e6;border-color:#f43f5e;opacity:.6}
.close{position:absolute;top:12px;right:14px;background:#f3f4f6;border-radius:50%;width:38px;height:38px;font-size:20px}
.msg{text-align:center}.msg .heart{font-size:56px}.msg p{font-size:24px;line-height:1.45;margin:10px 0 6px}.msg .sig{font-family:"Snell Roundhand","Brush Script MT",cursive;font-size:30px;color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.kp{display:grid;grid-template-columns:repeat(3,70px);gap:10px;justify-content:center;margin-top:14px}.kp button{height:60px;border-radius:14px;background:#ede9fe;font-size:24px;font-weight:800;color:var(--ink)}
.dots{font-size:30px;letter-spacing:10px;text-align:center}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:8px 0}.bars div{flex:1;text-align:center;font-size:11px}.bars i{display:block;background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0;margin-bottom:4px}
.sec{background:#faf5ff;border-radius:14px;padding:12px 14px;margin:12px 0}
.sec h3{margin:0 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea,select{font:inherit;padding:8px;border-radius:10px;border:1px solid #ccc}
.conf{position:fixed;inset:0;pointer-events:none;z-index:99}
.sw{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
</style></head><body>

jacob:[['Jacob\'s twin brother was…','👬',['Esau','Joseph','Abel','Isaac']],['Jacob\'s father was…','👴',['Isaac','Abraham','Noah','Moses']]],
jeremiah:[['Jeremiah was a…','📣',['Prophet','King','Fisherman','Soldier']],['Even in hard times Jeremiah stayed…','🌅',['Hopeful in God','Angry','Asleep','Lost']]],
draw:[['Drawings often start with simple…','✏️',['Shapes','Words','Numbers only','Stickers']],['Mixing blue and yellow makes…','🎨',['Green','Purple','Orange','Pink']],['Mixing red and yellow makes…','🎨',['Orange','Green','Blue','Black']],['Red, yellow and blue are the ___ colors.','🖍️',['Primary','Secondary','Neutral','Night']],['An artist who paints with dots is using…','🔵',['Pointillism','Sculpture','Music','Pottery']]]
};
const TOPIC_FALL={math:'numbers',reading:'grammar',science:'animals',geography:'world',bible:'creation',art:'draw'};
// math generators (tier 1..3)
function mathQ(tp,tier){const g=[];const T=tier;
 const gens={
 place:()=>{const n=100+R(T>1?9900:900);const ds=String(n).split('');const i=R(ds.length);const names=['ones','tens','hundreds','thousands'];const pos=ds.length-1-i;return [`In ${n.toLocaleString()}, what is the value of the digit ${ds[i]}?`,'🔢',(+ds[i]*10**pos),[+ds[i],+ds[i]*10**((pos+1)%4),+ds[i]*10**((pos+2)%4)]]},
 add:()=>{const a=15+R(T*60),b=17+R(T*50);return [`${a} + ${b} = ?`,'➕',a+b,[a+b+10,a+b-10,a+b+1]]},
 sub:()=>{const a=50+R(T*80),b=11+R(a-20);return [`${a} − ${b} = ?`,'➖',a-b,[a-b+10,a-b-1,a-b+2]]},
 mul:()=>{const a=2+R(T<2?4:9),b=2+R(T<2?5:9);return [`${a} × ${b} = ?`,'✖️',a*b,[a*b+a,a*b-b,a+b]]},
 div:()=>{const b=2+R(T<2?3:8),q=2+R(8);return [`${b*q} ÷ ${b} = ?`,'➗',q,[q+1,q-1,b]]},
 frac:()=>{const d=pick([2,3,4,6,8]),n=1+R(d-1);return [`A pizza is cut into ${d} equal slices. You eat ${n}. What fraction did you eat?`,'🍕',`${n}/${d}`,[`${d}/${n}`,`${n}/${d+1}`,`1/${n+d}`]]},
 time:()=>{const h=1+R(12),m=pick([0,15,30,45]),add=pick([15,30,60]);let mm=m+add,hh=h+Math.floor(mm/60);mm%=60;hh=(hh-1)%12+1;const f=(a,b)=>a+':'+String(b).padStart(2,'0');return [`It is ${f(h,m)}. What time will it be in ${add} minutes?`,'⏰',f(hh,mm),[f(h,(m+30)%60),f(hh%12+1,mm),f(h,m)]]},
 money:()=>{const q=R(4),d=R(4),n=R(3),p=1+R(5);const t=q*25+d*10+n*5+p;return [`How many cents: ${q} quarters, ${d} dimes, ${n} nickels and ${p} pennies?`,'🪙',t+'¢',[(t+5)+'¢',(t-1)+'¢',(t+10)+'¢']]},
 word:()=>{const a=3+R(6),b=2+R(T*4);return pick([[`Amelia has ${a} bags with ${b} marbles each. How many marbles in all?`,'🫙',a*b,[a+b,a*b+b,a*b-1]],[`A bookshelf has ${a*b} books shared equally on ${a} shelves. How many on each shelf?`,'📚',b,[b+1,a,b+2]],[`Amelia read ${a*10} pages Monday and ${b*10+5} pages Tuesday. How many pages total?`,'📖',a*10+b*10+5,[a*10+b*10,a*10+b*10+15,a+b]]])},
 logic:()=>pick([['What comes next? 2, 4, 8, 16, …','🧩',32,[18,20,24]],['What comes next? 5, 10, 15, 20, …','🧩',25,[21,30,22]],['What comes next? 1, 4, 9, 16, …','🧩',25,[20,17,32]],['Mia is taller than Zoe. Zoe is taller than Ava. Who is shortest?','🧍‍♀️','Ava',['Mia','Zoe','They are equal']],['I am a number. Double me and add 3 to get 11. What am I?','🤔',4,[8,5,3]],['A triangle has how many sides?','🔺',3,[4,5,6]]]),
 shape:()=>pick([['How many sides does a hexagon have?','⬡',6,[5,8,4]],['How many lines of symmetry does a square have?','⬛',4,[2,1,8]],['A shape with 8 sides is an…','🛑','Octagon',['Hexagon','Pentagon','Triangle']],['Sliding a shape without turning it is called a…','➡️','Translation',['Rotation','Reflection','Fraction']],['Flipping a shape like a mirror is a…','🪞','Reflection',['Translation','Rotation','Division']]]),
 measure:()=>pick([['How many cups are in a pint?','🥛',2,[4,1,8]],['How many quarts are in a gallon?','🪣',4,[2,8,3]],['Which holds more?','🧃','A gallon',['A cup','A pint','A quart']],['How many inches are in a foot?','📏',12,[10,100,3]]]),
 roman:()=>pick([['What number is the Roman numeral X?','🏛️',10,[5,50,1]],['What number is the Roman numeral V?','🏛️',5,[10,50,100]],['What is XII?','🏛️',12,[7,21,102]]])};
 const pref={numbers:['place','add','sub','mul','word','logic','roman','div'],fractions:['frac','frac','frac','div','mul','word'],money:['money','money','word','add','sub'],shapes:['shape','shape','logic','mul'],measure:['measure','measure','time','word']}[tp]||['add','sub','mul'];
 const all=['place','add','sub','mul','div','frac','time','money','word','logic'];
 for(let i=0;i<10;i++){const gname=i<5?pref[i%pref.length]:pick(all);const[q,e,a,w]=gens[gname]();const opts=shuf([a,...[...new Set(w.map(String))].filter(x=>x!==String(a)).slice(0,3)]);g.push({q,e,a:String(a),o:opts.map(String)})}return g}
function buildQuiz(v,tier){if(v.cat==='math')return mathQ(v.tp,tier);let pool=(BANK[v.tp]||[]).slice();const extra=Object.entries(BANK).filter(([k])=>k!==v.tp&&(TOPIC_FALL[v.cat]===k||catOf(k)===v.cat)).flatMap(([k,a])=>a);let qs=shuf(pool).concat(shuf(extra));
 const out=[];const seen=new Set();for(const[q,e,o]of qs){if(seen.has(q))continue;seen.add(q);out.push({q,e,a:o[0],o:shuf(o)});if(out.length>=8)break}
 const mq=mathQ('numbers',tier);while(out.length<10)out.push(Object.assign(mq.pop(),{bonus:1}));return shuf(out)}
const CATMAP={volcano:'science',space:'science',gravity:'science',matter:'science',engineering:'science',body:'science',animals:'science',earth:'science',states:'geography',world:'geography',history:'geography',lit:'reading',poetry:'reading',phonics:'reading',grammar:'reading',creation:'bible',daniel:'bible',jesus:'bible',nehemiah:'bible',noah:'bible',david:'bible',jacob:'bible',jeremiah:'bible',draw:'art'};
const catOf=k=>CATMAP[k];
// ---------- quiz ----------
let Q=null;
function startQuiz(id){const v=VIDS.find(x=>x.id===id)||(set.extra||[]).find(x=>x.id===id)||{id,cat:'science',tp:'animals',t:'Video'};const tier=ctx?LV[ctx.level].tier:2;Q={v,qs:buildQuiz(v,tier),i:0,score:0,first:true,log:[]};$('#quizOv').classList.add('on');showQ()}
function showQ(){const q=Q.qs[Q.i];$('#quizBox').innerHTML=`<button class="close" id="qx">✕</button><div style="font-weight:800;color:var(--p)">${CATS[Q.v.cat][1]} Quiz · Question ${Q.i+1} of ${Q.qs.length}</div><div class="qprog"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div class="qpic">${q.e}</div><div class="big" style="text-align:center;font-weight:700">${esc(q.q)} <button class="hbtn" style="background:#ede9fe;font-size:18px" id="rd">🔊</button></div><div class="ans">${q.o.map(o=>`<button>${esc(o)}</button>`).join('')}</div><div id="fb" style="text-align:center;font-weight:800;min-height:28px;margin-top:10px"></div>`;
 $('#qx').onclick=()=>{$('#quizOv').classList.remove('on');speechSynthesis&&speechSynthesis.cancel();renderAll()};$('#rd').onclick=()=>say(q.q+'. '+q.o.join(', or '));say(q.q);Q.first=true;
 document.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{if(b.textContent===q.a){b.classList.add('ok');if(Q.first)Q.score++;Q.log.push({q:q.q,ok:Q.first});$('#fb').textContent=pick(['Brilliant! 🌟','Exactly right! ✨','You nailed it! 💜','Super smart! 🧠']);say($('#fb').textContent.replace(/[^\w! ]/g,''));setTimeout(()=>{Q.i++;Q.i<Q.qs.length?showQ():finishQuiz()},900)}else{b.classList.add('no');b.disabled=true;Q.first=false;$('#fb').textContent='Not quite — try again! You can do it.';say('Not quite. Try again!')}})}
function finishQuiz(){const v=Q.v,sc=Q.score,n=Q.qs.length,stars=sc>=9?3:sc>=7?2:1;S.set('stars',S.get('stars',0)+stars);
 const h=S.get('hist',[]);h.push({date:today(),t:new Date().toLocaleTimeString(),id:v.id,title:clean(v.t),cat:v.cat,score:sc,of:n,level:ctx?LV[ctx.level].n:null,ans:Q.log});S.set('hist',h);
 let msg='',lvlDone=false;if(ctx){const l=LV[ctx.level],p=prog();p.vdone[l.n]=[...new Set([...(p.vdone[l.n]||[]),v.id])];if(l.vids.every(x=>p.vdone[l.n].includes(x))&&!p.done.includes(l.n)){p.done.push(l.n);lvlDone=true;const d=day();d.lessons.push(l.n);saveDay(d)}S.set('prog',p)}
 const nextV=ctx&&!lvlDone?LV[ctx.level].vids.find(x=>!(prog().vdone[LV[ctx.level].n]||[]).includes(x)):null;
 $('#quizBox').innerHTML=`<div class="msg"><div class="heart">🏆</div><p>${sc} out of ${n}!</p><div style="font-size:40px">${'⭐'.repeat(stars)}</div><div style="font-size:18px;margin:10px 0">${lvlDone?'Level complete! A new level is unlocked. 🎉':sc>=7?'Amazing thinking, Amelia!':'Great effort — every try makes your brain stronger!'}</div><div class="row" style="justify-content:center">${nextV?'<button class="btn t" id="nv">Next video ➜</button>':''}<button class="btn" id="qd">Done</button></div></div>`;
 confetti();say(`You got ${sc} out of ${n}! ${lvlDone?'Level complete!':''}`);
 $('#qd').onclick=()=>{$('#quizOv').classList.remove('on');renderAll();if(locked())doLock('lessons')};if(nextV)$('#nv').onclick=()=>{$('#quizOv').classList.remove('on');if(locked())return doLock('lessons');playVid(nextV)}}
function confetti(){const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,r:4+Math.random()*5,c:pick(['#7c3aed','#f43f5e','#f59e0b','#0d9488','#a78bfa'])}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+f)/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
// ---------- daily message ----------
function showMsg(){const all=MSGS.concat(set.custom||[]);let last=S.get('lastmsg',-1),i;do{i=R(all.length)}while(all.length>1&&i===last);S.set('lastmsg',i);$('#msgTxt').textContent=all[i];$('#msgSig').textContent=set.sig;$('#msgOv').classList.add('on');say(all[i]+' '+set.sig)}
$('#msgGo').onclick=()=>{$('#msgOv').classList.remove('on');speechSynthesis&&speechSynthesis.cancel();if(locked())doLock('lessons')};
// ---------- PIN ----------
let pinBuf='',pinCb=null;function askPin(cb){pinBuf='';pinCb=cb;$('#pinD').textContent='○○○○';$('#pinOv').classList.add('on')}
$('#kp').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
document.querySelectorAll('#kp button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(k!=='✓'&&pinBuf.length<4)pinBuf+=k;$('#pinD').textContent='●'.repeat(pinBuf.length)+'○'.repeat(4-pinBuf.length);if(pinBuf.length===4){if(pinBuf===set.pin){$('#pinOv').classList.remove('on');pinCb&&pinCb()}else{$('#pinQ').textContent='Wrong PIN, try again';pinBuf='';setTimeout(()=>$('#pinD').textContent='○○○○',300)}}});
$('#pinX').onclick=()=>$('#pinOv').classList.remove('on');
$('#parentBtn').onclick=()=>askPin(openParent);$('#lockPar').onclick=()=>askPin(()=>{$('#lockOv').classList.remove('on');openParent()});
// ---------- parent dashboard ----------
function openParent(){const h=S.get('hist',[]),d=day(),p=prog(),mins=S.get('mins',{}),ll=S.get('locklog',[]);const tot=h.reduce((a,x)=>a+x.score,0),of=h.reduce((a,x)=>a+x.of,0);
 const bycat=Object.keys(CATS).map(c=>{const r=h.filter(x=>x.cat===c);const s=r.reduce((a,x)=>a+x.score,0),o=r.reduce((a,x)=>a+x.of,0);return `<tr><td>${CATS[c][1]} ${CATS[c][0]}</td><td>${r.length}</td><td>${o?Math.round(s/o*100)+'%':'—'}</td></tr>`}).join('');
 const days=[...Array(7)].map((_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-6+i);const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');const r=h.filter(x=>x.date===k);const s=r.reduce((a,x)=>a+x.score,0),o=r.reduce((a,x)=>a+x.of,0);return{l:dt.toLocaleDateString(undefined,{weekday:'short'}),pc:o?Math.round(s/o*100):0,m:mins[k]||0}});
 $('#parBox').innerHTML=`<button class="close" id="px">✕</button><h2>👩‍👧 Parent Dashboard</h2>
 <div class="row"><div class="sec" style="flex:1"><h3>Today</h3>${d.lessons.length} / ${set.maxLessons} lessons · ${Math.round(d.sec/60)} / ${set.maxMin} min ${locked()?'· <b style="color:#e11d48">Locked</b>':d.unlocked?'· <b>Unlocked by parent</b>':''}<br><button class="btn t" id="unl" style="margin-top:8px">Unlock for today</button></div>
 <div class="sec" style="flex:1"><h3>Overall</h3>Level ${p.done.length} of ${LV.length} complete<br>${h.length} quizzes · ${of?Math.round(tot/of*100):0}% correct<br>⭐ ${S.get('stars',0)} stars</div></div>
 <div class="sec"><h3>7-day trend (% correct · minutes)</h3><div class="bars">${days.map(x=>`<div><i style="height:${Math.max(3,x.pc)}px"></i>${x.pc}%<br>${x.m}m<br>${x.l}</div>`).join('')}</div></div>
 <div class="sec"><h3>By subject</h3><table><tr><th>Subject</th><th>Quizzes</th><th>% correct</th></tr>${bycat}</table></div>
 <div class="sec"><h3>Quiz history (score per video)</h3><div style="max-height:220px;overflow:auto"><table><tr><th>Date</th><th>Video</th><th>Subject</th><th>Score</th></tr>${h.slice().reverse().map(x=>`<tr><td>${x.date} ${x.t}</td><td>${esc(x.title)}</td><td>${CATS[x.cat][1]}</td><td><b>${x.score}/${x.of}</b></td></tr>`).join('')||'<tr><td colspan=4>No quizzes yet</td></tr>'}</table></div></div>
 <div class="sec"><h3>Lockout log</h3>${ll.slice(-7).reverse().map(x=>`${x.date} ${x.at} — ${x.why==='time'?'time limit':'lesson limit'}`).join('<br>')||'None yet'}</div>
 <div class="sec"><h3>Settings</h3><div class="row">Lessons/day <input id="sL" type="number" min="1" max="20" value="${set.maxLessons}" style="width:70px"> Minutes/day <input id="sM" type="number" min="10" max="600" value="${set.maxMin}" style="width:80px"> New PIN <input id="sP" maxlength="4" inputmode="numeric" placeholder="4 digits" style="width:100px"></div>
 <div class="row" style="margin-top:8px">Message signature <input id="sS" value="${esc(set.sig)}"> <label class="sw"><input type="checkbox" id="sT" ${set.tts?'checked':''}> Read aloud</label></div>
 <div style="margin-top:8px">Add your own daily messages (one per line):<br><textarea id="sC" rows="3" style="width:100%">${esc((set.custom||[]).join('\n'))}</textarea></div>
 <div class="row" style="margin-top:8px">Add a YouTube video ID <input id="aV" placeholder="e.g. dQw4w9WgXcQ" style="width:150px"> <select id="aC">${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c[0]}</option>`).join('')}</select> Hide video ID <input id="hV" style="width:150px"></div>
 <div class="row" style="margin-top:10px"><button class="btn" id="sv">Save settings</button><button class="btn alt" id="ex">Export data</button><button class="btn c" id="rs">Reset progress</button></div></div>`;
 $('#px').onclick=()=>{$('#parOv').classList.remove('on');renderAll();if(locked())doLock('lessons')};
 $('#unl').onclick=()=>{const d=day();d.unlocked=true;saveDay(d);openParent()};
 $('#sv').onclick=()=>{set.maxLessons=+$('#sL').value||3;set.maxMin=+$('#sM').value||180;const np=$('#sP').value.trim();if(/^\d{4}$/.test(np))set.pin=np;set.sig=$('#sS').value.trim()||'Love, Mom';set.tts=$('#sT').checked;set.custom=$('#sC').value.split('\n').map(s=>s.trim()).filter(Boolean);const av=$('#aV').value.trim();if(/^[\w-]{11}$/.test(av)){set.extra=(set.extra||[]).concat({id:av,t:'Added by parent',ch:'Parent pick',cat:$('#aC').value,tp:TOPIC_FALL[$('#aC').value]})}const hv=$('#hV').value.trim();if(hv)set.hidden=(set.hidden||[]).concat(hv);saveSet();ttsIcon();alert('Saved!');openParent()};
 $('#ex').onclick=()=>{const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(K))data[k]=localStorage.getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='amelia-progress-'+today()+'.json';a.click()};
 $('#rs').onclick=()=>{if(confirm('Reset all of Amelia\'s progress and history? Settings are kept.')){['prog','hist','stars','day','mins','locklog'].forEach(k=>localStorage.removeItem(K+k));openParent()}};
 $('#parOv').classList.add('on')}
// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.t==='msg'){showMsg();return}document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('#pathV').hidden=b.dataset.t!=='path';$('#freeV').hidden=b.dataset.t!=='free'});
function renderAll(){renderPath();renderFree()}
ttsIcon();renderAll();showMsg();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
</script></body></html>
